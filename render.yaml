# Render Blueprint: New > Blueprint > เลือก repo นี้
services:
  - type: web
    name: inventory-system
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
databases:
  - name: inventory-db
    plan: free
