# Render Blueprint: ใช้ฐานข้อมูลร่วมกับ Order Tracking (free plan มีฐานข้อมูลได้ 1 ตัว)
# ตอน Sync ระบบจะถามค่า DATABASE_URL ให้วาง Internal Database URL ของ order-tracking-db
services:
  - type: web
    name: inventory-system
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false